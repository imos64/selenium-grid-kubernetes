name: Qualify and publish the November Chromium candidate
on:
  push:
    branches: [qualify/chromium-6901341]
permissions:
  contents: read
  packages: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6901341db89e85e5147479c4fb0b3ae9d2406e4b
          persist-credentials: false
      - name: Build and qualify the pinned source
        run: python3 scripts/qualify_runtime.py chromium --output evidence
      - name: Publish the qualified image
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          revision=$(git rev-parse HEAD)
          image="ghcr.io/imos64/selenium-grid-chromium:$revision"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "local-grid-chromium:$revision" "$image"
          docker push "$image" | tee evidence/publish.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: chromium-build-receipt
          path: evidence/
