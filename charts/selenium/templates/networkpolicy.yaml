apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: selenium-workload-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: selenium
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          platform-access: 'true'
